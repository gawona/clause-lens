spring.application.name=backend

#file
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

file.upload-dir=uploads/documents

#jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/clauselens
spring.datasource.username=clauselens
spring.datasource.password=clauselens
spring.datasource.driver-class-name=org.postgresql.Driver

#swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

#analysis-engine
analysis-engine.base-url=http://localhost:8000

# OpenSearch
opensearch.url=${OPENSEARCH_URL:http://localhost:9200}
opensearch.index.document-chunks=document_chunks

# OpenAI
openai.api-key=${OPENAI_API_KEY}
openai.base-url=https://api.openai.com/v1
openai.model=${OPENAI_MODEL:gpt-5.4-nano}
